[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "infusion-pump-rag"
version = "1.2.0"
description = "输液泵 / 注射泵 小型 RAG 知识库：零依赖可离线运行，带可复现评测集"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
  "rag", "retrieval", "bm25", "knowledge-base",
  "infusion-pump", "syringe-pump", "medical-device",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
# 语义检索（可选）。不装也能跑，默认链路是纯 BM25。
dense = ["sentence-transformers>=2.2"]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
infusion-rag = "infusion_rag.cli:main"

[tool.setuptools]
packages = ["infusion_rag"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["index"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = [
  "E501",    # 行长由 formatter 处理
  "SIM108",  # 三元表达式不一定比 if 清楚
  "B008",    # 测试里会用到
  "RET504",  # 顺序的正则替换逐行写比嵌套调用好读
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]
"infusion_rag/server.py" = ["E501"]  # 内嵌的 HTML/CSS 不按 100 列换行

[tool.mypy]
files = ["infusion_rag"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
